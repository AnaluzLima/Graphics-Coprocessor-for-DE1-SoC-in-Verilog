<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" width="100%" height="auto">
  <defs>
    <style>
      /* Animação suave para ondulação e movimento das ondas */
      @keyframes waveAnimation1 {
        0% { transform: translateY(0px) scaleY(1); }
        50% { transform: translateY(8px) scaleY(1.03); }
        100% { transform: translateY(0px) scaleY(1); }
      }

      @keyframes waveAnimation2 {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-6px) translateX(-15px); }
        100% { transform: translateY(0px) translateX(0px); }
      }

      .wave-layer-1 {
        animation: waveAnimation1 5s ease-in-out infinite;
        transform-origin: bottom;
      }

      .wave-layer-2 {
        animation: waveAnimation2 7s ease-in-out infinite;
        transform-origin: bottom;
      }

      .main-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 70px;
        fill: #ffffff;
        text-anchor: middle;
        letter-spacing: 2px;
      }
      .sub-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-style: normal;
        font-size: 19px;
        fill: #f0f0f0;
        text-anchor: middle;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <g class="wave-layer-2">
    <path fill="#6d7b48" fill-opacity="0.5" d="M 0,0 L 1440,0 L 1470,350 C 1200,280 900,360 680,320 C 420,275 180,360 0,350 Z" />
  </g>

  <g class="wave-layer-1">
    <path fill="#6d7b48" d="M 0,0 L 1440,0 L 1440,310 C 1150,350 950,270 720,290 C 480,310 250,370 0,330 Z" />
  </g>

  <text x="720" y="130" class="main-title">DESENVOLVIMENTO DE UM</text>
  <text x="720" y="195" class="main-title">COPROCESSADOR GRÁFICO 2D</text>

  <text x="720" y="230" class="sub-title">Arquitetura modular em Verilog com interface HPS-FPGA na plataforma DE1-SoC</text>
</svg>
